[tool:pytest]
# ============================================================================
# PYTEST CONFIGURATION FOR MULTI-TENANT PIPELINE
# ============================================================================

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = 
    pandas_engine
    polars_engine
    dask_engine
    router_function

# Minimum version
minversion = 6.0

# Addopts for consistent test execution
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --showlocals
    --durations=10
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --maxfail=5
    --disable-warnings

# Parallel execution options (requires pytest-xdist)
# Uncomment these when pytest-xdist is available
# addopts = 
#     -n auto
#     --dist=worksteal

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated tests)
    integration: Integration tests (slower, tests interaction between components)
    performance: Performance tests (benchmarking and load tests)
    security: Security tests (vulnerability and compliance tests)
    smoke: Smoke tests (basic functionality validation)
    pandas: Pandas engine specific tests
    polars: Polars engine specific tests
    dask: Dask engine specific tests
    router: Router function specific tests
    slow: Slow running tests (> 5 seconds)
    fast: Fast running tests (< 1 second)
    critical: Critical path tests that must pass
    gcs: Tests that interact with Google Cloud Storage
    bigquery: Tests that interact with BigQuery
    network: Tests that require network connectivity
    
# Filtering options
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    error::UserWarning
    
# Logging configuration during tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test timeout (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Coverage configuration
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    setup.py
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
title = Multi-Tenant Pipeline Test Coverage

[coverage:xml]
output = coverage.xml